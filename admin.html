<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบจัดการหลังบ้าน - รับเรื่องร้องเรียน/ร้องทุกข์</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts (Prompt) -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Prompt', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen">

    <!-- Header / Navbar -->
    <nav class="bg-indigo-900 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold flex items-center gap-2">
                <span>🔐</span> ระบบจัดการหลังบ้าน (เจ้าหน้าที่)
            </h1>
            <div id="userInfo" class="hidden flex items-center gap-4">
                <span id="userEmail" class="text-sm text-indigo-200"></span>
                <button id="logoutBtn" class="bg-rose-500 hover:bg-rose-600 px-3 py-1.5 rounded-lg text-xs font-medium transition shadow">
                    ออกจากระบบ
                </button>
            </div>
            <a href="index.html" class="text-sm text-indigo-200 hover:text-white flex items-center gap-1">
                ← กลับหน้าหลัก
            </a>
        </div>
    </nav>

    <!-- 1. หน้าล็อกอิน ( Login Form ) -->
    <div id="loginSection" class="max-w-md mx-auto mt-16 p-6">
        <div class="bg-white rounded-2xl shadow-xl p-8 border border-slate-100">
            <h2 class="text-2xl font-bold text-center text-slate-800 mb-6 flex justify-center items-center gap-2">
                เข้าสู่ระบบเจ้าหน้าที่ 🔑
            </h2>
            <form id="loginForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">อีเมล</label>
                    <input type="email" id="loginEmail" required class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition" placeholder="admin@example.com">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">รหัสผ่าน</label>
                    <input type="password" id="loginPassword" required class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition" placeholder="••••••••">
                </div>
                <p id="loginError" class="text-rose-500 text-xs hidden"></p>
                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 rounded-xl transition shadow-md hover:shadow-lg">
                    เข้าสู่ระบบ
                </button>
            </form>
        </div>
    </div>

    <!-- 2. หน้าจัดการข้อมูล ( Admin Dashboard - ซ่อนไว้ก่อนล็อกอิน ) -->
    <div id="adminSection" class="hidden max-w-7xl mx-auto px-4 py-8">
        
        <!-- ฟอร์มเพิ่มคำร้องเรียนใหม่ -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 mb-8">
            <h3 class="text-lg font-bold text-slate-800 mb-4 flex items-center gap-2">
                <span>➕</span> บันทึกคำร้องเรียน / ร้องทุกข์ใหม่
            </h3>
            <form id="addComplaintForm" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                <div>
                    <label class="block text-xs font-medium text-slate-600 mb-1">ผู้ร้องเรียน</label>
                    <input type="text" id="complainantName" placeholder="ชื่อ-สกุล / ผู้แจ้ง" required class="w-full px-3 py-2 rounded-lg border border-slate-300 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-600 mb-1">เรื่องร้องเรียน</label>
                    <input type="text" id="complaintSubject" placeholder="เช่น ท่อประปาแตก / ไฟถนนดับ" required class="w-full px-3 py-2 rounded-lg border border-slate-300 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-600 mb-1">ระดับความด่วน (สีเคส)</label>
                    <select id="caseColor" required class="w-full px-3 py-2 rounded-lg border border-slate-300 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                        <option value="black">⚫ เร่งด่วนวิกฤต (สีดำ)</option>
                        <option value="red">🔴 เร่งด่วนมาก (สีแดง)</option>
                        <option value="yellow">🟡 เร่งด่วนปานกลาง (สีเหลือง)</option>
                        <option value="green">🟢 เรื่องทั่วไป (สีเขียว)</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-600 mb-1">ขั้นตอนดำเนินงาน</label>
                    <select id="caseStep" required class="w-full px-3 py-2 rounded-lg border border-slate-300 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                        <option value="รับเรื่อง">1. รับเรื่อง</option>
                        <option value="ส่งเรื่องให้ฝ่ายที่เกี่ยวข้อง">2. ส่งเรื่องให้ฝ่ายที่เกี่ยวข้อง</option>
                        <option value="กำลังดำเนินการ">3. กำลังดำเนินการ</option>
                        <option value="ดำเนินการเสร็จสิ้น">4. ดำเนินการเสร็จสิ้น</option>
                    </select>
                </div>
                <div class="md:col-span-2 lg:col-span-4 flex justify-end mt-2">
                    <button type="submit" class="bg-emerald-600 hover:bg-emerald-700 text-white font-medium px-6 py-2 rounded-xl text-sm transition shadow">
                        บันทึกรายการ
                    </button>
                </div>
            </form>
        </div>

        <!-- รายการคำร้องทั้งหมด -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
            <h3 class="text-lg font-bold text-slate-800 mb-4 flex items-center gap-2">
                <span>📋</span> รายการคำร้องเรียนทั้งหมด
            </h3>
            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm text-slate-600">
                    <thead class="bg-slate-100 text-slate-700 uppercase text-xs">
                        <tr>
                            <th class="p-3 rounded-l-lg">วันที่/เวลา</th>
                            <th class="p-3">ระดับ</th>
                            <th class="p-3">ผู้ร้องเรียน</th>
                            <th class="p-3">เรื่อง</th>
                            <th class="p-3">ขั้นตอนปัจจุบัน</th>
                            <th class="p-3 text-center rounded-r-lg">จัดการ</th>
                        </tr>
                    </thead>
                    <tbody id="complaintTableBody" class="divide-y divide-slate-100">
                        <tr>
                            <td colspan="6" class="text-center py-6 text-slate-400">กำลังโหลดข้อมูล...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <!-- Firebase Script (Module) -->
    <script type="module">
        import { 
            auth, 
            db, 
            signInWithEmailAndPassword, 
            signOut, 
            onAuthStateChanged, 
            collection, 
            addDoc, 
            getDocs, 
            doc, 
            updateDoc, 
            deleteDoc, 
            query, 
            orderBy 
        } from "./app.js";

        // DOM Elements
        const loginSection = document.getElementById('loginSection');
        const adminSection = document.getElementById('adminSection');
        const userInfo = document.getElementById('userInfo');
        const userEmail = document.getElementById('userEmail');
        const loginForm = document.getElementById('loginForm');
        const loginError = document.getElementById('loginError');
        const logoutBtn = document.getElementById('logoutBtn');
        const addComplaintForm = document.getElementById('addComplaintForm');
        const complaintTableBody = document.getElementById('complaintTableBody');

        // 1. ตรวจสอบสถานะการล็อกอิน
        onAuthStateChanged(auth, (user) => {
            if (user) {
                loginSection.classList.add('hidden');
                adminSection.classList.remove('hidden');
                userInfo.classList.remove('hidden');
                userEmail.textContent = user.email;
                loadComplaints();
            } else {
                loginSection.classList.remove('hidden');
                adminSection.classList.add('hidden');
                userInfo.classList.add('hidden');
            }
        });

        // 2. ฟังก์ชั่นเข้าสู่ระบบ
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            loginError.classList.add('hidden');
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;

            try {
                await signInWithEmailAndPassword(auth, email, password);
                loginForm.reset();
            } catch (error) {
                loginError.textContent = "อีเมลหรือรหัสผ่านไม่ถูกต้อง (" + error.message + ")";
                loginError.classList.remove('hidden');
            }
        });

        // 3. ฟังก์ชั่นออกจากระบบ
        logoutBtn.addEventListener('click', () => signOut(auth));

        // 4. ฟังก์ชั่นเพิ่มคำร้องเรียนใหม่
        addComplaintForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('complainantName').value;
            const subject = document.getElementById('complaintSubject').value;
            const color = document.getElementById('caseColor').value;
            const step = document.getElementById('caseStep').value;

            try {
                await addDoc(collection(db, "complaints"), {
                    complainantName: name,
                    subject: subject,
                    color: color,
                    step: step,
                    createdAt: new Date().toISOString()
                });
                addComplaintForm.reset();
                loadComplaints();
                alert("บันทึกข้อมูลเรียบร้อยแล้ว!");
            } catch (error) {
                alert("เกิดข้อผิดพลาดในการบันทึก: " + error.message);
            }
        });

        // 5. ดึงรายการคำร้องมาแสดงผล
        async function loadComplaints() {
            complaintTableBody.innerHTML = '<tr><td colspan="6" class="text-center py-6 text-slate-400">กำลังโหลดข้อมูล...</td></tr>';
            try {
                const q = query(collection(db, "complaints"), orderBy("createdAt", "desc"));
                const querySnapshot = await getDocs(q);
                
                if (querySnapshot.empty) {
                    complaintTableBody.innerHTML = '<tr><td colspan="6" class="text-center py-6 text-slate-400">ยังไม่มีข้อมูลคำร้องเรียน</td></tr>';
                    return;
                }

                let html = '';
                querySnapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    const id = docSnap.id;
                    const date = new Date(data.createdAt).toLocaleDateString('th-TH', {
                        day: 'numeric', month: 'short', year: '2-digit', hour: '2-digit', minute: '2-digit'
                    });

                    // แปลงสัญลักษณ์สี
                    let colorBadge = '';
                    if(data.color === 'black') colorBadge = '<span class="bg-black text-white text-xs px-2 py-1 rounded-full">⚫ ดำ</span>';
                    else if(data.color === 'red') colorBadge = '<span class="bg-red-500 text-white text-xs px-2 py-1 rounded-full">🔴 แดง</span>';
                    else if(data.color === 'yellow') colorBadge = '<span class="bg-amber-400 text-slate-900 text-xs px-2 py-1 rounded-full">🟡 เหลือง</span>';
                    else colorBadge = '<span class="bg-emerald-500 text-white text-xs px-2 py-1 rounded-full">🟢 เขียว</span>';

                    html += `
                        <tr class="hover:bg-slate-50">
                            <td class="p-3 text-xs whitespace-nowrap text-slate-400">${date}</td>
                            <td class="p-3 whitespace-nowrap">${colorBadge}</td>
                            <td class="p-3 font-medium text-slate-800">${data.complainantName}</td>
                            <td class="p-3 text-slate-700">${data.subject}</td>
                            <td class="p-3">
                                <select onchange="window.updateStep('${id}', this.value)" class="text-xs bg-slate-50 border border-slate-200 rounded-lg p-1.5 focus:ring-1 focus:ring-indigo-500 outline-none">
                                    <option value="รับเรื่อง" ${data.step === 'รับเรื่อง' ? 'selected' : ''}>1. รับเรื่อง</option>
                                    <option value="ส่งเรื่องให้ฝ่ายที่เกี่ยวข้อง" ${data.step === 'ส่งเรื่องให้ฝ่ายที่เกี่ยวข้อง' ? 'selected' : ''}>2. ส่งเรื่องให้ฝ่ายฯ</option>
                                    <option value="กำลังดำเนินการ" ${data.step === 'กำลังดำเนินการ' ? 'selected' : ''}>3. กำลังดำเนินการ</option>
                                    <option value="ดำเนินการเสร็จสิ้น" ${data.step === 'ดำเนินการเสร็จสิ้น' ? 'selected' : ''}>4. เสร็จสิ้น</option>
                                </select>
                            </td>
                            <td class="p-3 text-center">
                                <button onclick="window.deleteComplaint('${id}')" class="text-rose-500 hover:text-rose-700 text-xs font-medium bg-rose-50 hover:bg-rose-100 px-2.5 py-1 rounded-lg transition">
                                    ลบ
                                </button>
                            </td>
                        </tr>
                    `;
                });
                complaintTableBody.innerHTML = html;
            } catch (error) {
                complaintTableBody.innerHTML = `<tr><td colspan="6" class="text-center py-6 text-rose-500">โหลดข้อมูลไม่สำเร็จ: ${error.message}</td></tr>`;
            }
        }

        // 6. ฟังก์ชั่นอัปเดตขั้นตอน (ผูกเข้ากับ window เพื่อให้กดจาก HTML ได้)
        window.updateStep = async (id, newStep) => {
            try {
                const docRef = doc(db, "complaints", id);
                await updateDoc(docRef, { step: newStep });
                alert("อัปเดตขั้นตอนเรียบร้อยแล้ว");
            } catch (error) {
                alert("อัปเดตไม่สำเร็จ: " + error.message);
            }
        };

        // 7. ฟังก์ชั่นลบรายการ
        window.deleteComplaint = async (id) => {
            if (confirm("คุณแน่ใจหรือไม่ว่าต้องการลบรายการนี้?")) {
                try {
                    await deleteDoc(doc(db, "complaints", id));
                    loadComplaints();
                } catch (error) {
                    alert("ลบไม่สำเร็จ: " + error.message);
                }
            }
        };
    </script>
</body>
</html>
