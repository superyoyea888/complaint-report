<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>บันทึก/จัดการคำร้องร้องทุกข์</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style> body { font-family: 'Prompt', sans-serif; } </style>
</head>
<body class="bg-slate-50 text-gray-700 min-h-screen">

    <nav class="bg-white border-b border-gray-100">
        <div class="max-w-5xl mx-auto px-6 py-4 flex justify-between items-center">
            <h1 class="text-lg font-bold text-gray-800">🔐 ระบบจัดการหลังบ้าน</h1>
            <a href="index.html" class="text-sm font-medium text-gray-400 hover:text-gray-600">← กลับหน้าหลัก</a>
        </div>
    </nav>

    <!-- หน้า ล็อกอิน -->
    <div id="loginSection" class="max-w-md mx-auto mt-16 p-8 bg-white rounded-3xl shadow-sm border border-gray-100">
        <h2 class="text-xl font-bold text-center mb-6 text-gray-800">เข้าสู่ระบบเจ้าหน้าที่ 🗝️</h2>
        <form id="loginForm" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-gray-500 mb-1">อีเมล</label>
                <input type="email" id="email" required class="w-full px-4 py-2.5 rounded-2xl border border-gray-200 focus:ring-2 focus:ring-indigo-400 outline-none text-sm">
            </div>
            <div>
                <label class="block text-xs font-semibold text-gray-500 mb-1">รหัสผ่าน</label>
                <input type="password" id="password" required class="w-full px-4 py-2.5 rounded-2xl border border-gray-200 focus:ring-2 focus:ring-indigo-400 outline-none text-sm">
            </div>
            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 rounded-2xl transition text-sm">เข้าสู่ระบบ</button>
            <p id="loginError" class="text-rose-500 text-xs text-center mt-2"></p>
        </form>
    </div>

    <!-- หน้า ฟอร์มกรอกและจัดการข้อมูล -->
    <main id="adminSection" class="max-w-5xl mx-auto px-6 py-8 hidden">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-xl font-bold text-gray-800">📝 บันทึกคำร้องใหม่</h2>
            <button id="logoutBtn" class="bg-rose-50 hover:bg-rose-100 text-rose-600 px-4 py-2 rounded-xl text-xs font-semibold transition">ออกจากระบบ</button>
        </div>

        <!-- ฟอร์มเพิ่มเคส -->
        <form id="addForm" class="bg-white p-6 rounded-3xl shadow-sm border border-gray-100 space-y-4 mb-8">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-gray-500 mb-1">วัน/เดือน/ปี (พ.ศ.)</label>
                    <input type="text" id="caseDate" required class="w-full px-4 py-2 rounded-xl border border-gray-200 bg-gray-50 text-sm font-medium">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-500 mb-1">ชุมชน</label>
                    <input type="text" id="caseCommunity" placeholder="เช่น เด่นห้า" required class="w-full px-4 py-2 rounded-xl border border-gray-200 focus:ring-2 focus:ring-indigo-400 outline-none text-sm">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-500 mb-1">ซอย</label>
                    <input type="text" id="caseSoi" placeholder="เช่น ซอย 4" required class="w-full px-4 py-2 rounded-xl border border-gray-200 focus:ring-2 focus:ring-indigo-400 outline-none text-sm">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-500 mb-2">เคสสี (ระดับความเร่งด่วน)</label>
                <div class="grid grid-cols-2 md:grid-cols-4 gap-3 text-xs">
                    <label class="flex items-center gap-2 p-3 border rounded-2xl cursor-pointer hover:bg-gray-50">
                        <input type="radio" name="caseColor" value="black" required> ⚫ เรียนผู้บริหาร
                    </label>
                    <label class="flex items-center gap-2 p-3 border rounded-2xl cursor-pointer hover:bg-rose-50 text-rose-700">
                        <input type="radio" name="caseColor" value="red"> 🔴 อันตราย
                    </label>
                    <label class="flex items-center gap-2 p-3 border rounded-2xl cursor-pointer hover:bg-amber-50 text-amber-800">
                        <input type="radio" name="caseColor" value="yellow"> 🟡 กระทบชีวิต
                    </label>
                    <label class="flex items-center gap-2 p-3 border rounded-2xl cursor-pointer hover:bg-emerald-50 text-emerald-700">
                        <input type="radio" name="caseColor" value="green"> 🟢 เร่งทำใน 3 วัน
                    </label>
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-500 mb-1">ขั้นตอนเริ่มต้น</label>
                <select id="caseStep" class="w-full px-4 py-2 rounded-xl border border-gray-200 focus:ring-2 focus:ring-indigo-400 outline-none text-sm bg-white">
                    <option value="📥 รับเรื่องแล้ว">📥 1. รับเรื่องแล้ว</option>
                    <option value="🔍 กำลังตรวจสอบ/ลงพื้นที่">🔍 2. กำลังตรวจสอบ/ลงพื้นที่</option>
                    <option value="🛠️ กำลังดำเนินการแก้ไข">🛠️ 3. กำลังดำเนินการแก้ไข</option>
                    <option value="✅ เสร็จสิ้น">✅ 4. เสร็จสิ้น</option>
                </select>
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-500 mb-1">รายละเอียดคำร้อง</label>
                <textarea id="caseDetail" rows="3" required placeholder="อธิบายรายละเอียด..." class="w-full px-4 py-2 rounded-xl border border-gray-200 focus:ring-2 focus:ring-indigo-400 outline-none text-sm"></textarea>
            </div>

            <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium px-6 py-2.5 rounded-xl transition text-sm">💾 บันทึกคำร้อง</button>
        </form>

        <!-- รายการสำหรับอัปเดตสเต็ป/ลบ -->
        <h3 class="font-bold text-gray-800 mb-4">📋 อัปเดตขั้นตอนคำร้องที่บันทึกไว้</h3>
        <div id="adminList" class="space-y-3"></div>
    </main>

    <script type="module">
        import { auth, db, signInWithEmailAndPassword, signOut, onAuthStateChanged, collection, addDoc, getDocs, doc, updateDoc, deleteDoc } from './app.js';

        // ใส่วัน เดือน พ.ศ. ปัจจุบันให้อัตโนมัติในฟอร์ม
        const now = new Date();
        const defaultDate = `${now.getDate().toString().padStart(2, '0')}/${(now.getMonth()+1).toString().padStart(2, '0')}/${now.getFullYear()+543}`;
        document.getElementById('caseDate').value = defaultDate;

        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('loginSection').classList.add('hidden');
                document.getElementById('adminSection').classList.remove('hidden');
                loadAdminList();
            } else {
                document.getElementById('loginSection').classList.remove('hidden');
                document.getElementById('adminSection').classList.add('hidden');
            }
        });

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            try {
                await signInWithEmailAndPassword(auth, document.getElementById('email').value, document.getElementById('password').value);
            } catch (err) {
                document.getElementById('loginError').innerText = 'อีเมลหรือรหัสผ่านไม่ถูกต้อง';
            }
        });

        document.getElementById('logoutBtn').addEventListener('click', () => signOut(auth));

        // บันทึกเคสใหม่
        document.getElementById('addForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const colorSelected = document.querySelector('input[name="caseColor"]:checked').value;
            
            await addDoc(collection(db, "complaints"), {
                dateStr: document.getElementById('caseDate').value,
                community: document.getElementById('caseCommunity').value,
                soi: document.getElementById('caseSoi').value,
                color: colorSelected,
                step: document.getElementById('caseStep').value,
                detail: document.getElementById('caseDetail').value,
                createdAt: new Date()
            });

            document.getElementById('addForm').reset();
            document.getElementById('caseDate').value = defaultDate;
            loadAdminList();
            alert('บันทึกคำร้องเรียบร้อยแล้ว!');
        });

        // โหลดรายการเพื่อเปลี่ยนสถานะขั้นตอน
        async function loadAdminList() {
            const listDiv = document.getElementById('adminList');
            listDiv.innerHTML = '<p class="text-xs text-gray-400">กำลังโหลด...</p>';
            const querySnapshot = await getDocs(collection(db, "complaints"));
            let html = '';

            querySnapshot.forEach((docSnap) => {
                const data = docSnap.data();
                const id = docSnap.id;
                html += `
                    <div class="bg-white p-4 rounded-2xl border border-gray-100 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                        <div>
                            <p class="font-semibold text-gray-800 text-sm">${data.community} - ${data.soi} <span class="text-xs text-gray-400">(${data.dateStr})</span></p>
                            <p class="text-xs text-gray-500 mt-0.5">${data.detail}</p>
                        </div>
                        <div class="flex items-center gap-2 w-full md:w-auto">
                            <!-- เปลี่ยนขั้นตอนได้ตรงนี้เลย -->
                            <select onchange="updateStep('${id}', this.value)" class="text-xs bg-slate-50 border border-gray-200 rounded-xl px-3 py-1.5 focus:outline-none">
                                <option value="📥 รับเรื่องแล้ว" ${data.step === '📥 รับเรื่องแล้ว' ? 'selected' : ''}>📥 1. รับเรื่องแล้ว</option>
                                <option value="🔍 กำลังตรวจสอบ/ลงพื้นที่" ${data.step === '🔍 กำลังตรวจสอบ/ลงพื้นที่' ? 'selected' : ''}>🔍 2. กำลังตรวจสอบ</option>
                                <option value="🛠️ กำลังดำเนินการแก้ไข" ${data.step === '🛠️ กำลังดำเนินการแก้ไข' ? 'selected' : ''}>🛠️ 3. กำลังแก้ไข</option>
                                <option value="✅ เสร็จสิ้น" ${data.step === '✅ เสร็จสิ้น' ? 'selected' : ''}>✅ 4. เสร็จสิ้น</option>
                            </select>
                            <button onclick="deleteCase('${id}')" class="text-xs text-rose-500 hover:bg-rose-50 p-1.5 rounded-xl transition">ลบ</button>
                        </div>
                    </div>
                `;
            });
            listDiv.innerHTML = html || '<p class="text-xs text-gray-400">ยังไม่มีข้อมูล</p>';
        }

        window.updateStep = async function(id, newStep) {
            await updateDoc(doc(db, "complaints", id), { step: newStep });
            alert('อัปเดตขั้นตอนเรียบร้อย!');
        };

        window.deleteCase = async function(id) {
            if(confirm('ต้องการลบรายการนี้หรือไม่?')) {
                await deleteDoc(doc(db, "complaints", id));
                loadAdminList();
            }
        };
    </script>
</body>
</html>
